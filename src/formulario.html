    <div id="sib-container" class="sib-container--large sib-container--vertical">

        <div class="sib-bloco">
          <div class="sib-input sib-form-block">
            <div class="form__entry entry_block">
              <div class="form__label-row ">
                <label class="entry__label" for="EMAIL" data-required="*">E-mail</label>
                <div class="entry__field">
                  <input class="input " type="text" id="EMAIL" name="EMAIL" autocomplete="email" inputmode="email" value="" placeholder="voce@empresa.com.br" data-required="true" required />
                </div>
              </div>
              <label class="entry__error entry__error--primary"></label>
            </div>
          </div>
        </div>

        <div class="sib-bloco">
          <div class="sib-input sib-form-block">
            <div class="form__entry entry_block">
              <div class="form__label-row ">
                <label class="entry__label" for="NOME">Nome</label>
                <div class="entry__field">
                  <input class="input " maxlength="200" type="text" id="NOME" name="NOME" autocomplete="name" placeholder="Seu nome" />
                </div>
              </div>
              <label class="entry__error entry__error--primary"></label>
            </div>
          </div>
        </div>

        <div class="sib-bloco">
          <div class="sib-sms-field sib-form-block">
            <div class="form__entry entry_block">
              <div class="form__label-row ">
                <label class="entry__label" for="SMS">WhatsApp com DDD (opcional)</label>
                <div class="sib-sms-input-wrapper">
                  <div class="sib-sms-input" data-placeholder="DDD + número" data-country-code="BR" data-value="" data-attributename="SMS">
                    <div class="entry__field">
                      <select class="input" name="SMS__COUNTRY_CODE">
                        <option value="+55">+55 BR</option>
                      </select>
                    </div>
                    <div class="entry__field" style="width: 100%">
                      <input type="tel" class="input" id="SMS" name="SMS" autocomplete="tel-national" inputmode="numeric" placeholder="DDD + número" />
                    </div>
                  </div>
                </div>
              </div>
              <label class="entry__error entry__error--primary"></label>
              <label class="entry__error entry__error--secondary"></label>
              <span class="entry__specification">Digite DDD + número, só números (ex.: 11987654321)</span>
            </div>
          </div>
        </div>

        <div class="sib-bloco">
          <div class="sib-select sib-form-block" data-required="true">
            <div class="form__entry entry_block">
              <div class="form__label-row ">
                <label class="entry__label" for="RAMO" data-required="*">Ramo da empresa</label>
                <div class="entry__field">
                  <select class="input" id="RAMO" name="RAMO" data-required="true">
                    <option value="" disabled selected hidden>Escolha um valor</option>
                    <option class="sib-menu__item" value="1">Comércio</option>
                    <option class="sib-menu__item" value="2">Indústria</option>
                    <option class="sib-menu__item" value="3">Serviços</option>
                    <option class="sib-menu__item" value="4">Profissional liberal</option>
                    <option class="sib-menu__item" value="5">Saúde</option>
                    <option class="sib-menu__item" value="6">Contador</option>
                    <option class="sib-menu__item" value="7">Outro</option>
                  </select>
                </div>
              </div>
              <label class="entry__error entry__error--primary"></label>
            </div>
          </div>
        </div>

        <div class="sib-bloco">
          <div class="sib-optin sib-form-block" data-required="true">
            <div class="form__entry entry_mcq">
              <div class="form__label-row ">
                <label class="entry__label" for="OPT_IN" data-required="*">Consentimento (LGPD)</label>
                <div class="entry__choice">
                  <label>
                    <input type="checkbox" class="input_replaced" value="1" id="OPT_IN" name="OPT_IN" required />
                    <span class="checkbox checkbox_tick_positive"></span><span class="texto-optin"><p>Concordo em receber e-mails e mensagens de WhatsApp do Decisor do Simples 2027, com o relatório, os avisos sobre a reforma e ofertas dos produtos, e li <a href="privacidade.html" target="_blank" rel="noopener">a Política de Privacidade</a>.</p></span>
                  </label>
                </div>
              </div>
              <label class="entry__error entry__error--primary"></label>
              <label class="entry__specification">Você pode se descadastrar a qualquer momento pelo link no fim de cada e-mail.</label>
            </div>
          </div>
        </div>

        <!-- RECAPTCHA: o bloco do Google reCAPTCHA v2 gerado pelo Brevo entra aqui, e o script
             https://www.google.com/recaptcha/api.js entra no fim deste arquivo, antes do main.js. -->

        <div class="sib-bloco">
          <div class="sib-form-block">
            <button class="sib-form-block__button sib-form-block__button-with-loader" form="sib-form" type="submit">
              <svg class="icon clickable__icon progress-indicator__icon sib-hide-loader-icon" viewBox="0 0 512 512"><path d="M460.116 373.846l-20.823-12.022c-5.541-3.199-7.54-10.159-4.663-15.874 30.137-59.886 28.343-131.652-5.386-189.946-33.641-58.394-94.896-95.833-161.827-99.676C261.028 55.961 256 50.751 256 44.352V20.309c0-6.904 5.808-12.337 12.703-11.982 83.556 4.306 160.163 50.864 202.11 123.677 42.063 72.696 44.079 162.316 6.031 236.832-3.14 6.148-10.75 8.461-16.728 5.01z" /></svg>
              Quero entrar na lista
            </button>
          </div>
        </div>

        <input type="text" name="email_address_check" value="" class="input--hidden">
        <input type="hidden" name="locale" value="pt">
      </form>
    </div>
